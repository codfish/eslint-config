name: Publish PR Version

on: pull_request_target

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node and install dependencies
        uses: codfish/actions/setup-node-and-install@a5d670e3eacf83aa1e1f906b86b04b8215c17e99 # v3
        with:
          node-version: lts/*
          # Required until all ESLint plugins update their peer dependencies to support ESLint 10
          install-options: --legacy-peer-deps

      - name: Build package
        run: npm run build --if-present

      - name: Create package tarball
        run: npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-tarball
          path: '*.tgz'
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # To checkout base branch
      pull-requests: write # To comment on PR

    steps:
      - name: Checkout base branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: codfish/actions/setup-node-and-install@a5d670e3eacf83aa1e1f906b86b04b8215c17e99 # v3
        with:
          node-version: lts/*
          # Required until all ESLint plugins update their peer dependencies to support ESLint 10
          install-options: --legacy-peer-deps

      - name: Download package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package-tarball

      - name: Publish PR package
        uses: codfish/actions/npm-publish-pr@a5d670e3eacf83aa1e1f906b86b04b8215c17e99 # v3
        with:
          tarball: '*.tgz'
          npm-token: ${{ secrets.NPM_TOKEN }}
          dev: true
